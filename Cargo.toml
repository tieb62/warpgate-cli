[package]
name = "warpgate-cli"
version = "0.1.0"
edition = "2024"
authors = ["TIEB62"]

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env", "wrap_help"] }
cross-exec = "0.1.1"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
skim = { version = "4.6.1", default-features = false }
ureq = { version = "3.3.0", features = ["json"] }
windows = { version = "0.62.2", features = ["Win32_System_Console"] }
